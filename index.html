<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Build Log — Vacation Sprint</title>
<style>
  :root{
    --navy-deep:#0c1a2e;
    --navy-panel:#11213a;
    --navy-line:#1f3a5c;
    --ink:#e6edf5;
    --ink-dim:#8ea3c2;
    --amber:#ff9f1c;
    --amber-dim:#c97e17;
    --green:#4ade80;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background-color:var(--navy-deep);
    background-image:
      repeating-linear-gradient(0deg, var(--navy-line) 0, var(--navy-line) 1px, transparent 1px, transparent 32px),
      repeating-linear-gradient(90deg, var(--navy-line) 0, var(--navy-line) 1px, transparent 1px, transparent 32px);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.4;
    padding-bottom:60px;
  }
  .wrap{max-width:640px; margin:0 auto; padding:0 16px;}

  header{padding:28px 16px 20px;}
  .eyebrow{
    font-family:var(--mono); font-size:12px; color:var(--amber);
    letter-spacing:0.02em; margin-bottom:6px;
  }
  h1{
    font-size:26px; margin:0 0 4px; font-weight:700; letter-spacing:-0.01em;
  }
  .subtitle{color:var(--ink-dim); font-size:14px; margin:0;}

  .countdown{
    margin-top:18px; background:var(--navy-panel); border:1px solid var(--navy-line);
    border-radius:4px; padding:16px; display:flex; align-items:baseline; gap:12px;
    position:relative;
  }
  .countdown::before, .countdown::after{
    content:""; position:absolute; width:8px; height:8px; border:1.5px solid var(--amber-dim); top:6px;
  }
  .countdown::before{left:6px; border-right:none; border-bottom:none;}
  .countdown::after{right:6px; border-left:none; border-bottom:none;}
  .countdown .num{font-family:var(--mono); font-size:34px; color:var(--amber); font-weight:600;}
  .countdown .label{font-size:13px; color:var(--ink-dim);}

  .progress-overview{
    margin-top:14px; background:var(--navy-panel); border:1px solid var(--navy-line);
    border-radius:4px; padding:14px 16px;
  }
  .progress-overview .row{display:flex; justify-content:space-between; font-size:13px; color:var(--ink-dim); margin-bottom:8px; font-family:var(--mono);}
  .bar-track{height:6px; background:var(--navy-deep); border:1px solid var(--navy-line); border-radius:3px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--amber); width:0%; transition:width .3s ease;}

  section.week{margin:22px 16px 0;}
  summary{
    list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; background:var(--navy-panel); border:1px solid var(--navy-line); border-radius:4px;
    font-family:var(--mono); font-size:14px;
  }
  summary::-webkit-details-marker{display:none;}
  summary .chevron{color:var(--amber-dim); transition:transform .2s ease; font-size:12px;}
  details[open] summary .chevron{transform:rotate(90deg);}
  summary .week-progress{color:var(--ink-dim); font-size:12px;}

  .days{padding:10px 0 4px;}
  .day{
    position:relative; margin:10px 0; padding:14px 14px 14px 16px;
    background:var(--navy-panel); border:1px solid var(--navy-line); border-left:3px solid var(--navy-line);
    border-radius:2px;
  }
  .day.rest{opacity:0.6;}
  .day.milestone{border-left-color:var(--amber);}
  .day-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; gap:8px; flex-wrap:wrap;}
  .day-date{font-family:var(--mono); font-size:12px; color:var(--ink-dim);}
  .day-dow{font-weight:600; font-size:14px; margin-right:6px;}
  .badge{
    font-family:var(--mono); font-size:10px; padding:2px 6px; border-radius:2px; letter-spacing:0.02em;
  }
  .badge.study{background:rgba(255,159,28,0.15); color:var(--amber); border:1px solid var(--amber-dim);}
  .badge.milestone-tag{background:rgba(74,222,128,0.12); color:var(--green); border:1px solid #2e7d52;}

  .task{display:flex; align-items:flex-start; gap:10px; padding:6px 0; font-size:14px;}
  .task input[type=checkbox]{
    appearance:none; -webkit-appearance:none; width:18px; height:18px; min-width:18px; margin-top:2px;
    border:1.5px solid var(--ink-dim); border-radius:3px; background:transparent; cursor:pointer; position:relative;
  }
  .task input[type=checkbox]:checked{background:var(--amber); border-color:var(--amber);}
  .task input[type=checkbox]:checked::after{
    content:"✓"; position:absolute; top:-3px; left:2px; font-size:13px; color:var(--navy-deep); font-weight:700;
  }
  .task label{flex:1;}
  .task label.done{color:var(--ink-dim); text-decoration:line-through;}
  .task .resource{display:block; font-size:12px; color:var(--ink-dim); margin-top:2px;}

  footer{margin:30px 16px 0; font-family:var(--mono); font-size:11px; color:var(--ink-dim); text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">// KELVIN — COMPUTER ENGINEERING, KNUST</div>
    <h1>Vacation Build Log</h1>
    <p class="subtitle">Level 300 → Level 400. Sep 14 – Oct 16, 2026.</p>

    <div class="countdown">
      <div class="num" id="countdownNum">--</div>
      <div class="label">days until school reopens (Oct 17)</div>
    </div>

    <div class="progress-overview">
      <div class="row"><span id="progressLabel">0 / 0 tasks done</span><span id="progressPct">0%</span></div>
      <div class="bar-track"><div class="bar-fill" id="progressBar"></div></div>
    </div>
  </header>

  <div id="weeksContainer"></div>

  <footer>
    BUILD LOG · OFFLINE COPY · PROGRESS SAVED ON THIS DEVICE
    <div style="margin-top:10px;">
      <button id="resetBtn" style="font-family:var(--mono); font-size:11px; background:transparent; color:var(--ink-dim); border:1px solid var(--navy-line); border-radius:3px; padding:6px 12px; cursor:pointer;">RESET ALL PROGRESS</button>
    </div>
  </footer>
</div>

<script>
const DATA = [
  { week:1, range:"Sep 14–20", days:[
    {date:"2026-09-14", dow:"Mon", studyApp:false, tasks:[
      {label:"C++/Python Basics: variables, loops, functions", res:"freeCodeCamp full course (first 2 hrs)"}
    ]},
    {date:"2026-09-15", dow:"Tue", studyApp:false, tasks:[
      {label:"C++/Python: arrays, strings, basic I/O", res:"freeCodeCamp course continued"}
    ]},
    {date:"2026-09-16", dow:"Wed", studyApp:true, tasks:[
      {label:"Git & GitHub Basics", res:"freeCodeCamp \"Git and GitHub for Beginners\" (~1hr) + practice repo"},
      {label:"OOP Basics: classes, objects", res:"Ties into COE 254 knowledge"}
    ]},
    {date:"2026-09-17", dow:"Thu", studyApp:false, tasks:[
      {label:"CS50 Intro Lecture + Problem Set", res:"CS50 (edX/YouTube), Week 0 or 1"}
    ]},
    {date:"2026-09-18", dow:"Fri", studyApp:true, milestone:true, tasks:[
      {label:"LeetCode: 3 Easy Problems", res:"leetcode.com"},
      {label:"Milestone: push first small project to GitHub", res:""}
    ]},
    {date:"2026-09-19", dow:"Sat", studyApp:true, tasks:[
      {label:"Buffer / catch-up on anything from this week", res:"Use if you're behind, otherwise free"}
    ]},
    {date:"2026-09-20", dow:"Sun", rest:true, tasks:[
      {label:"Rest / light review — church morning", res:""}
    ]},
  ]},
  { week:2, range:"Sep 21–27", days:[
    {date:"2026-09-21", dow:"Mon", studyApp:true, tasks:[
      {label:"DSA: Arrays, Linked Lists", res:"CS50 or freeCodeCamp DSA course"}
    ]},
    {date:"2026-09-22", dow:"Tue", studyApp:false, tasks:[
      {label:"LeetCode: 3 Easy Problems", res:"leetcode.com"}
    ]},
    {date:"2026-09-23", dow:"Wed", studyApp:true, tasks:[
      {label:"SQL Fundamentals", res:"SQLBolt (interactive, ~2–3 hrs)"}
    ]},
    {date:"2026-09-24", dow:"Thu", studyApp:false, tasks:[
      {label:"Backend Setup: FastAPI or Node/Express", res:"Official docs / freeCodeCamp course"}
    ]},
    {date:"2026-09-25", dow:"Fri", studyApp:true, tasks:[
      {label:"Backend: Build Basic CRUD Endpoint", res:"Same framework course"}
    ]},
    {date:"2026-09-26", dow:"Sat", studyApp:true, milestone:true, tasks:[
      {label:"LeetCode (2) + review Week 1–2 code", res:"leetcode.com"},
      {label:"Milestone: SQL done, basic API running locally", res:""}
    ]},
    {date:"2026-09-27", dow:"Sun", rest:true, tasks:[
      {label:"Rest — church morning", res:""}
    ]},
  ]},
  { week:3, range:"Sep 28–Oct 4", days:[
    {date:"2026-09-28", dow:"Mon", studyApp:true, tasks:[
      {label:"Backend: Connect API to Database", res:"Your framework's docs"}
    ]},
    {date:"2026-09-29", dow:"Tue", studyApp:false, tasks:[
      {label:"Backend: Authentication Basics", res:"Signup / login"}
    ]},
    {date:"2026-09-30", dow:"Wed", studyApp:true, tasks:[
      {label:"LeetCode: 3 Problems", res:"Mix Easy/Medium"}
    ]},
    {date:"2026-10-01", dow:"Thu", studyApp:false, tasks:[
      {label:"Taste Track: TryHackMe \"Pre Security\"", res:"tryhackme.com"}
    ]},
    {date:"2026-10-02", dow:"Fri", studyApp:true, tasks:[
      {label:"Taste Track: continue TryHackMe, or Andrew Ng ML Course 1", res:"Coursera (audit free) if security doesn't grab you"}
    ]},
    {date:"2026-10-03", dow:"Sat", studyApp:true, milestone:true, tasks:[
      {label:"Backend project: add a feature (search, pagination)", res:""},
      {label:"Milestone: notice which direction is pulling you", res:""}
    ]},
    {date:"2026-10-04", dow:"Sun", rest:true, tasks:[
      {label:"Rest — church morning", res:""}
    ]},
  ]},
  { week:4, range:"Oct 5–11", days:[
    {date:"2026-10-05", dow:"Mon", studyApp:true, tasks:[
      {label:"AWS Cloud Practitioner Essentials — Module 1–2", res:"AWS Skill Builder (free)"}
    ]},
    {date:"2026-10-06", dow:"Tue", studyApp:false, tasks:[
      {label:"AWS Cloud Practitioner Essentials — Module 3–4", res:"AWS Skill Builder"}
    ]},
    {date:"2026-10-07", dow:"Wed", studyApp:true, tasks:[
      {label:"LeetCode: 3 Problems", res:"leetcode.com"}
    ]},
    {date:"2026-10-08", dow:"Thu", studyApp:false, tasks:[
      {label:"AWS Cloud Practitioner Essentials — remaining modules", res:""}
    ]},
    {date:"2026-10-09", dow:"Fri", studyApp:true, tasks:[
      {label:"Deploy backend project to a free-tier cloud service", res:"Render, Railway, or AWS free tier"}
    ]},
    {date:"2026-10-10", dow:"Sat", studyApp:true, milestone:true, tasks:[
      {label:"Fix deployment issues, polish GitHub README", res:""},
      {label:"Milestone: your project is live on the internet", res:""}
    ]},
    {date:"2026-10-11", dow:"Sun", rest:true, tasks:[
      {label:"Rest — church morning", res:""}
    ]},
  ]},
  { week:5, range:"Oct 12–16", days:[
    {date:"2026-10-12", dow:"Mon", studyApp:true, tasks:[
      {label:"Capstone: plan project (backend + DB + deployment)", res:"Real use case for your combined skills"}
    ]},
    {date:"2026-10-13", dow:"Tue", studyApp:false, tasks:[
      {label:"Capstone: build core functionality", res:""}
    ]},
    {date:"2026-10-14", dow:"Wed", studyApp:true, tasks:[
      {label:"Capstone: finish features + tests", res:""}
    ]},
    {date:"2026-10-15", dow:"Thu", studyApp:false, tasks:[
      {label:"Capstone: deploy + write clean GitHub README", res:"What it does, tech stack, how to run"}
    ]},
    {date:"2026-10-16", dow:"Fri", studyApp:true, milestone:true, tasks:[
      {label:"Final polish + LeetCode review (5 problems)", res:""},
      {label:"Reflect: which specialization pulled you most?", res:"School reopens tomorrow"}
    ]},
  ]},
];

const container = document.getElementById('weeksContainer');
const dowFull = {Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday",Sat:"Saturday",Sun:"Sunday"};

function fmtDate(iso){
  const d = new Date(iso+"T00:00:00");
  const day = d.getDate();
  const month = d.toLocaleString('en-US',{month:'short'});
  return `${day} ${month}`;
}

let totalTasks = 0, allCheckboxes = [];

DATA.forEach((week, wi) => {
  const section = document.createElement('section');
  section.className = 'week';

  const details = document.createElement('details');
  details.open = wi === 0;

  const summary = document.createElement('summary');
  summary.innerHTML = `<span>WEEK ${week.week} <span style="color:var(--ink-dim); font-weight:400;">· ${week.range}</span></span>
    <span style="display:flex; align-items:center; gap:10px;">
      <span class="week-progress" id="week-progress-${wi}">0/0</span>
      <span class="chevron">▶</span>
    </span>`;
  details.appendChild(summary);

  const daysWrap = document.createElement('div');
  daysWrap.className = 'days';

  week.days.forEach((day, di) => {
    const dayEl = document.createElement('div');
    dayEl.className = 'day' + (day.rest ? ' rest' : '') + (day.milestone ? ' milestone' : '');

    let badges = '';
    if(day.studyApp) badges += `<span class="badge study">STUDY APP 15:00</span>`;
    if(day.milestone) badges += `<span class="badge milestone-tag">MILESTONE</span>`;

    const head = document.createElement('div');
    head.className = 'day-head';
    head.innerHTML = `<span><span class="day-dow">${dowFull[day.dow]}</span><span class="day-date">${fmtDate(day.date)}</span></span>
      <span>${badges}</span>`;
    dayEl.appendChild(head);

    day.tasks.forEach((task, ti) => {
      totalTasks++;
      const id = `t-${wi}-${di}-${ti}`;
      const row = document.createElement('div');
      row.className = 'task';
      row.innerHTML = `<input type="checkbox" id="${id}" data-week="${wi}">
        <label for="${id}">${task.label}${task.res ? `<span class="resource">${task.res}</span>` : ''}</label>`;
      dayEl.appendChild(row);
    });

    daysWrap.appendChild(dayEl);
  });

  details.appendChild(daysWrap);
  section.appendChild(details);
  container.appendChild(section);
});

allCheckboxes = Array.from(document.querySelectorAll('.task input[type=checkbox]'));

const STORAGE_KEY = 'vacation-build-log-progress';

function loadProgress(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    allCheckboxes.forEach(cb => {
      if(saved[cb.id]){
        cb.checked = true;
        const label = document.querySelector(`label[for="${cb.id}"]`);
        if(label) label.classList.add('done');
      }
    });
  }catch(e){ /* corrupted or unavailable storage — start fresh */ }
}

function saveProgress(){
  try{
    const state = {};
    allCheckboxes.forEach(cb => { if(cb.checked) state[cb.id] = true; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ /* storage unavailable — progress just won't persist */ }
}

loadProgress();

function updateProgress(){
  const checked = allCheckboxes.filter(cb => cb.checked).length;
  const pct = totalTasks ? Math.round((checked/totalTasks)*100) : 0;
  document.getElementById('progressLabel').textContent = `${checked} / ${totalTasks} tasks done`;
  document.getElementById('progressPct').textContent = `${pct}%`;
  document.getElementById('progressBar').style.width = pct + '%';

  DATA.forEach((week, wi) => {
    const weekBoxes = allCheckboxes.filter(cb => cb.dataset.week == wi);
    const weekChecked = weekBoxes.filter(cb => cb.checked).length;
    document.getElementById(`week-progress-${wi}`).textContent = `${weekChecked}/${weekBoxes.length}`;
  });
}

allCheckboxes.forEach(cb => {
  cb.addEventListener('change', () => {
    const label = document.querySelector(`label[for="${cb.id}"]`);
    label.classList.toggle('done', cb.checked);
    updateProgress();
    saveProgress();
  });
});

updateProgress();

function updateCountdown(){
  const target = new Date("2026-10-17T00:00:00");
  const now = new Date();
  const diffDays = Math.ceil((target - now) / (1000*60*60*24));
  document.getElementById('countdownNum').textContent = diffDays > 0 ? diffDays : 0;
}
updateCountdown();

document.getElementById('resetBtn').addEventListener('click', () => {
  if(confirm('Reset all checked tasks? This cannot be undone.')){
    allCheckboxes.forEach(cb => {
      cb.checked = false;
      const label = document.querySelector(`label[for="${cb.id}"]`);
      if(label) label.classList.remove('done');
    });
    updateProgress();
    saveProgress();
  }
});
</script>
</body>
</html>
